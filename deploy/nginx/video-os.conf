# Reverse proxy for the plain Node server (server/index.js) listening on
# 127.0.0.1:8080 (see deploy/video-os.env.example's PORT/HOST).
#
# Setup on the VPS:
#   1. Replace video-os.example.com below with your real domain.
#   2. cp this file to /etc/nginx/sites-available/video-os.conf
#      ln -s /etc/nginx/sites-available/video-os.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d video-os.example.com
#      (certbot rewrites this file in place to add the listen 443 ssl
#      server block and the http->https redirect; the server block below
#      is deliberately left as plain HTTP for certbot to do that.)

server {
    listen 80;
    listen [::]:80;
    server_name video-os.example.com;

    # Uploads are base64 data URLs (~1.34x the raw file) inside a JSON body,
    # capped at 20MB raw in api/video-os-lite/uploads.js -- give real headroom
    # above server/index.js's own 30MB transport-level buffering cap.
    client_max_body_size 32m;

    # Final video downloads (api/video-os-lite/download-v2.js) can be large,
    # streamed MP4s; don't let nginx buffer the whole thing before forwarding.
    proxy_buffering off;
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
