name: Watchdog heartbeat check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out heartbeat checker
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Require a recent persisted watchdog heartbeat
        env:
          VIDEO_OS_BASE_URL: ${{ vars.VIDEO_OS_BASE_URL }}
        run: bash scripts/heartbeat-check.sh
