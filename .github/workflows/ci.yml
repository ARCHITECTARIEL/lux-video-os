name: CI
on:
  pull_request:
    branches: [codex/db-binding-prealias-review-base-20261005]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact diagnostic candidate head
        env:
          REVIEWED_HEAD: aab769f5b48c3504feb2384a6a66d7d4e42668b0
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$PR_HEAD" = "$REVIEWED_HEAD"
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:imports
      - run: npm run test:unit
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: npm run db:check
      - run: node tools/enforce-npm-audit.mjs
      - run: npm run workflow:validate
      - name: Prepare offline Vercel build metadata
        run: |
          mkdir -p .vercel
          printf '%s' '{"projectId":"prj_jZYuVgIAk1cwx8MRKE5kGNxn4ItW","orgId":"team_rTOCyHyMxhhdoLk4LtT2kD9X","projectName":"lux-video-os","settings":{"framework":null,"devCommand":null,"installCommand":null,"buildCommand":null,"outputDirectory":null,"rootDirectory":null,"directoryListing":false,"nodeVersion":"24.x"}}' > .vercel/project.json
          : > .vercel/.env.preview.local
      - name: Package preview artifacts (not production verification)
        run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4187
          VIDEO_OS_E2E_OFFLINE: 'true'
