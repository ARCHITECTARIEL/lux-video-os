name: Watchdog sweep

# Triggers the deployed stalled-job sweep every 15 minutes. Production has
# had VIDEO_OS_BASE_URL and VIDEO_OS_CRON_SECRET configured since September 21, 2026.
# Missing configuration is an operational failure, so this workflow fails
# closed instead of treating a skipped sweep as healthy.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main watchdog code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify health, sweep stalled jobs, and smoke hosted routes
        env:
          VIDEO_OS_BASE_URL: ${{ vars.VIDEO_OS_BASE_URL }}
          VIDEO_OS_CRON_SECRET: ${{ secrets.VIDEO_OS_CRON_SECRET }}
        run: |
          export EXPECTED_GIT_SHA="$(git rev-parse HEAD)"
          export MAIN_HEAD_EPOCH="$(git log -1 --format=%ct HEAD)"
          bash scripts/watchdog-check.sh
