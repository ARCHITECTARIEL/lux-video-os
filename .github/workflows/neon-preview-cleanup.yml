name: Cleanup Neon preview branch
on:
  pull_request:
    types: [closed]
permissions: {}
concurrency: neon-cleanup-${{ github.head_ref }}
jobs:
  delete-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository  # forks get no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        continue-on-error: true   # branch may not exist (preview failed / never provisioned)
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
