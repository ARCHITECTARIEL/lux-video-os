name: Stripe reconciliation
# Triggers lib/video-os-stripe-reconciliation.js's Stripe-vs-ledger
# reconciliation on the deployed Vercel app, on a schedule -- see that
# module's own comment for why it exists (docs/P0-RELEASE-GATE.md's
# operating contract requires "Reconcile daily: ... every Stripe event has
# at most one applied grant"). Same trigger shape as
# .github/workflows/watchdog-sweep.yml, but daily rather than every 15
# minutes: this checks money correctness against Stripe's own records, not
# job health, and the gate doc's own SLO is "reconciliation complete daily
# by 10:00 UTC" -- 09:00 UTC gives an hour of margin before that deadline.
#
# Requires the same two repository configuration values watchdog-sweep.yml
# does (Settings > Secrets and variables > Actions) -- reused, not
# duplicated:
#   - Secret VIDEO_OS_CRON_SECRET
#   - Variable VIDEO_OS_BASE_URL
# Missing workflow configuration fails the run: a skipped reconciliation is
# not evidence that the ledger is clean. The deployed app also requires
# STRIPE_SECRET_KEY; reconcileStripePayments() fails loud (503) if it is
# absent. The response gate validates the JSON result and fails on every
# reported mismatch, even when the endpoint returns HTTP 200.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the response gate
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Reconcile Stripe payments against the credit ledger
        env:
          CRON_SECRET: ${{ secrets.VIDEO_OS_CRON_SECRET }}
          BASE_URL: ${{ vars.VIDEO_OS_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Stripe reconciliation configuration is incomplete. Configure VIDEO_OS_BASE_URL and VIDEO_OS_CRON_SECRET."
            exit 1
          fi
          if ! status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST "$BASE_URL/api/video-os-lite/admin?operation=stripe-reconciliation" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'); then
            echo "::error::Stripe reconciliation request could not reach the configured endpoint."
            exit 1
          fi
          node tools/check-stripe-reconciliation-response.mjs --status "$status" --file response.json
