name: RunPod Standard worker image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/runpod-standard-adapter
    paths:
      - workers/sadtalker-runpod/**
      - .github/workflows/runpod-worker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/sadtalker-runpod
          file: workers/sadtalker-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/architectariel/lux-video-os-sadtalker-runpod:transport-${{ github.sha }}
