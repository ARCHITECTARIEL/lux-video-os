name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - name: Enforce CodeQL findings
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          const files = (await readdir('codeql-results')).filter((name) => name.endsWith('.sarif'));
          if (!files.length) throw new Error('CodeQL produced no SARIF output.');
          let findings = 0;
          for (const file of files) {
            const sarif = JSON.parse(await readFile(`codeql-results/${file}`, 'utf8'));
            for (const run of sarif.runs || []) findings += (run.results || []).length;
          }
          console.log(`CodeQL SARIF gate inspected ${files.length} file(s) and found ${findings} result(s).`);
          if (findings) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
