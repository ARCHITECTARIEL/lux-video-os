name: CodeQL
on:
  pull_request:
    branches: [codex/app-maintenance-review-base-20261006]
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact diagnostic candidate head
        env:
          REVIEWED_HEAD: 2a2122c8c593c0c49e1ae52d6338f313709c5127
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$PR_HEAD" = "$REVIEWED_HEAD"
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - name: Retain CodeQL SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ github.event.pull_request.head.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Download retained CodeQL SARIF artifact
        uses: actions/download-artifact@v8
        with:
          name: codeql-sarif-${{ github.event.pull_request.head.sha }}
          path: codeql-enforced-results
      - name: Enforce retained CodeQL SARIF artifact
        run: node tools/enforce-codeql-sarif.mjs codeql-enforced-results
