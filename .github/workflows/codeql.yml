name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    # Pinned image (ubuntu-latest is moving to 26.04).
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      # Keep file coverage information on pull requests (CodeQL Action, Apr 2026).
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
          # Pinned CodeQL CLI bundle for reproducible results.
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux64.tar.gz
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - name: Retain CodeQL SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Download retained CodeQL SARIF artifact
        uses: actions/download-artifact@v8
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-enforced-results
      - name: Enforce retained CodeQL SARIF artifact
        run: node tools/enforce-codeql-sarif.mjs codeql-enforced-results
