name: LatentSync worker image

# Real `docker build` verification for workers/latentsync-runpod/ -- this
# sandbox environment has no reachable Docker daemon, so this is the actual
# build check (see PR #74's own "not verified end-to-end" caveat). On a pull
# request this only builds (push: false) to prove the Dockerfile is correct
# without publishing an unreviewed image; on main it also pushes to GHCR,
# mirroring the existing pattern in runpod-worker-image.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - workers/latentsync-runpod/**
      - .github/workflows/latentsync-worker-image.yml
  push:
    branches:
      - main
    paths:
      - workers/latentsync-runpod/**
      - .github/workflows/latentsync-worker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/latentsync-runpod
          file: workers/latentsync-runpod/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ghcr.io/architectariel/lux-video-os-latentsync-runpod:latest
            ghcr.io/architectariel/lux-video-os-latentsync-runpod:${{ github.sha }}
